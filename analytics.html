<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - BulkMaster Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="api.js"></script>
</head>

<body>
    <div class="bg-gradient"></div>

    <nav class="sidebar">
        <div class="sidebar-logo"><i class="fas fa-layer-group"></i><span>BulkMaster Pro</span></div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-box"></i> Orders</a></li>
            <li class="nav-item"><a href="workflows.html" class="nav-link"><i class="fas fa-robot"></i> Workflows</a>
            </li>
            <li class="nav-item"><a href="templates.html" class="nav-link"><i class="fas fa-file-alt"></i> Templates</a>
            </li>
            <li class="nav-item"><a href="analytics.html" class="nav-link active"><i class="fas fa-chart-bar"></i>
                    Analytics</a></li>
            <li class="nav-item"><a href="settings.html" class="nav-link"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Analytics</h1>
                <p class="page-subtitle">Order performance insights and metrics</p>
            </div>
            <button class="btn btn-outline" onclick="exportReport()"><i class="fas fa-download"></i> Export
                Report</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon primary"><i class="fas fa-shopping-cart"></i></div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success"><i class="fas fa-dollar-sign"></i></div>
                <div class="stat-value" id="totalRevenue">$0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning"><i class="fas fa-receipt"></i></div>
                <div class="stat-value" id="avgOrder">$0</div>
                <div class="stat-label">Avg Order Value</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon danger"><i class="fas fa-check-circle"></i></div>
                <div class="stat-value" id="fulfillRate">0%</div>
                <div class="stat-label">Fulfillment Rate</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3 class="card-title"><i class="fas fa-chart-line"></i> Order Trend</h3>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="card">
                <h3 class="card-title"><i class="fas fa-chart-pie"></i> Order Status</h3>
                <div class="chart-container"><canvas id="statusChart"></canvas></div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title"><i class="fas fa-chart-bar"></i> Revenue by Day</h3>
            <div class="chart-container"><canvas id="revenueChart"></canvas></div>
        </div>
    </main>

    <script>
        let trendChart, statusChart, revenueChart;

        function loadAnalytics() {
            const analytics = BulkAPI.getAnalytics();
            const orders = BulkAPI.orders.getAll();

            document.getElementById('totalOrders').textContent = analytics.total;
            document.getElementById('totalRevenue').textContent = BulkAPI.format.currency(analytics.revenue);
            document.getElementById('avgOrder').textContent = BulkAPI.format.currency(analytics.avgOrderValue);
            document.getElementById('fulfillRate').textContent = analytics.total ? Math.round(analytics.fulfilled / analytics.total * 100) + '%' : '0%';

            renderCharts(analytics, orders);
        }

        function renderCharts(analytics, orders) {
            // Trend chart
            const ctx1 = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            trendChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'Orders',
                        data: days.map(() => Math.floor(Math.random() * 10) + analytics.total / 7),
                        borderColor: '#06b6d4',
                        backgroundColor: 'rgba(6,182,212,0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });

            // Status chart
            const ctx2 = document.getElementById('statusChart').getContext('2d');
            if (statusChart) statusChart.destroy();

            statusChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Pending', 'Fulfilled', 'Cancelled'],
                    datasets: [{
                        data: [analytics.pending, analytics.fulfilled, analytics.cancelled],
                        backgroundColor: ['#f59e0b', '#10b981', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8' } } },
                    cutout: '60%'
                }
            });

            // Revenue chart
            const ctx3 = document.getElementById('revenueChart').getContext('2d');
            if (revenueChart) revenueChart.destroy();

            revenueChart = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'Revenue',
                        data: days.map(() => Math.random() * 500 + analytics.revenue / 7),
                        backgroundColor: '#8b5cf6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', callback: v => '$' + v } }
                    }
                }
            });
        }

        function exportReport() {
            const analytics = BulkAPI.getAnalytics();
            const report = `BulkMaster Pro Analytics Report
Generated: ${new Date().toLocaleString()}

Summary:
- Total Orders: ${analytics.total}
- Total Revenue: ${BulkAPI.format.currency(analytics.revenue)}
- Average Order Value: ${BulkAPI.format.currency(analytics.avgOrderValue)}
- Fulfillment Rate: ${analytics.total ? Math.round(analytics.fulfilled / analytics.total * 100) : 0}%

Status Breakdown:
- Pending: ${analytics.pending}
- Fulfilled: ${analytics.fulfilled}
- Cancelled: ${analytics.cancelled}`;

            const blob = new Blob([report], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'analytics-report.txt';
            a.click();
            BulkAPI.toast.success('Report exported!');
        }

        loadAnalytics();
    </script>
</body>

</html>
