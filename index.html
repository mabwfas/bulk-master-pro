<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkMaster Pro - Bulk Order Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f0f23;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text: #fff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .logo i {
            color: var(--primary);
        }

        .logo span {
            background: linear-gradient(135deg, var(--primary), #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card h3 {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h3 i {
            color: var(--primary);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-warning {
            background: var(--warning);
            color: #000;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 0 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .search-box i {
            color: var(--text-muted);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 0.6rem;
            color: var(--text);
            width: 200px;
        }

        .search-box input:focus {
            outline: none;
        }

        select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 1rem;
            text-align: left;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        th:hover {
            color: var(--text);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .order-id {
            font-weight: 600;
            color: var(--primary);
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.fulfilled {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .bulk-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: none;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .bulk-panel.active {
            display: flex;
        }

        .selected-count {
            font-weight: 600;
            color: var(--primary);
            min-width: 100px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <header>
        <div class="logo"><i class="fas fa-boxes-stacked"></i><span>BulkMaster Pro</span></div>
        <div style="display: flex; gap: 1rem;">
            <button class="btn btn-outline" onclick="importOrders()"><i class="fas fa-upload"></i> Import CSV</button>
            <button class="btn btn-primary" onclick="showAddModal()"><i class="fas fa-plus"></i> Add Order</button>
        </div>
    </header>

    <main class="container">
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="fulfilledOrders">0</div>
                <div class="stat-label">Fulfilled</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRevenue">$0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
        </div>

        <div class="card">
            <div class="toolbar">
                <div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Search orders..."
                        id="searchInput" oninput="filterOrders()"></div>
                <select id="statusFilter" onchange="filterOrders()">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="fulfilled">Fulfilled</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button class="btn btn-outline" onclick="selectAll()"><i class="fas fa-check-double"></i> Select
                    All</button>
                <button class="btn btn-outline" onclick="clearSelection()"><i class="fas fa-times"></i> Clear</button>
                <button class="btn btn-outline" onclick="exportCSV()"><i class="fas fa-download"></i> Export
                    CSV</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width:50px;"><input type="checkbox" class="checkbox" id="selectAllCheckbox"
                                onchange="toggleSelectAll()"></th>
                        <th onclick="sortBy('id')">Order ID</th>
                        <th onclick="sortBy('customer')">Customer</th>
                        <th onclick="sortBy('email')">Email</th>
                        <th onclick="sortBy('date')">Date</th>
                        <th onclick="sortBy('status')">Status</th>
                        <th onclick="sortBy('items')">Items</th>
                        <th onclick="sortBy('amount')">Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </div>
    </main>

    <div class="bulk-panel" id="bulkPanel">
        <span class="selected-count"><span id="selectedCount">0</span> selected</span>
        <button class="btn btn-success" onclick="bulkAction('fulfilled')"><i class="fas fa-check"></i> Mark
            Fulfilled</button>
        <button class="btn btn-warning" onclick="bulkAction('pending')"><i class="fas fa-clock"></i> Mark
            Pending</button>
        <button class="btn btn-danger" onclick="bulkAction('cancelled')"><i class="fas fa-ban"></i> Cancel</button>
        <button class="btn btn-danger" onclick="bulkDelete()"><i class="fas fa-trash"></i> Delete</button>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1.5rem;">Add Order</h3>
            <div class="form-group"><label>Customer Name</label><input type="text" id="customerName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="customerEmail"></div>
            <div class="form-group"><label>Number of Items</label><input type="number" id="itemCount" value="1"></div>
            <div class="form-group"><label>Amount ($)</label><input type="number" id="orderAmount" step="0.01"></div>
            <div class="form-group"><label>Status</label><select id="orderStatus">
                    <option value="pending">Pending</option>
                    <option value="fulfilled">Fulfilled</option>
                </select></div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-primary" onclick="addOrder()" style="flex:1;"><i class="fas fa-plus"></i> Add
                    Order</button>
                <button class="btn btn-outline" onclick="hideAddModal()">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <p>BulkMaster Pro - Manage orders in bulk</p>
    </footer>

    <script>
        let orders = JSON.parse(localStorage.getItem('bulkMasterOrders') || '[]');
        let selectedOrders = new Set();
        let sortField = 'date';
        let sortDir = 'desc';

        function generateId() { return '#' + Math.random().toString(36).substr(2, 6).toUpperCase(); }

        function renderOrders(data = null) {
            const filtered = data || getFilteredOrders();
            const tbody = document.getElementById('ordersTable');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No orders found. Add your first order!</td></tr>';
            } else {
                tbody.innerHTML = filtered.map((o, i) => `
                    <tr>
                        <td><input type="checkbox" class="checkbox" ${selectedOrders.has(o.id) ? 'checked' : ''} onchange="toggleOrder('${o.id}')"></td>
                        <td><span class="order-id">${o.id}</span></td>
                        <td>${o.customer}</td>
                        <td>${o.email}</td>
                        <td>${new Date(o.date).toLocaleDateString()}</td>
                        <td><span class="status-badge ${o.status}">${o.status.charAt(0).toUpperCase() + o.status.slice(1)}</span></td>
                        <td>${o.items} item${o.items > 1 ? 's' : ''}</td>
                        <td>$${o.amount.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-outline" style="padding: 0.4rem 0.6rem;" onclick="editOrder('${o.id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-danger" style="padding: 0.4rem 0.6rem;" onclick="deleteOrder('${o.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
            updateStats();
            updateBulkPanel();
        }

        function getFilteredOrders() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            let filtered = orders.filter(o => {
                const matchSearch = o.customer.toLowerCase().includes(search) || o.id.toLowerCase().includes(search) || o.email.toLowerCase().includes(search);
                const matchStatus = !status || o.status === status;
                return matchSearch && matchStatus;
            });

            // Sort
            filtered.sort((a, b) => {
                let aVal = a[sortField];
                let bVal = b[sortField];
                if (sortField === 'date') { aVal = new Date(aVal); bVal = new Date(bVal); }
                if (sortField === 'amount' || sortField === 'items') { aVal = Number(aVal); bVal = Number(bVal); }
                if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });

            return filtered;
        }

        function sortBy(field) {
            if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
            else { sortField = field; sortDir = 'asc'; }
            renderOrders();
        }

        function filterOrders() { renderOrders(); }

        function updateStats() {
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
            document.getElementById('fulfilledOrders').textContent = orders.filter(o => o.status === 'fulfilled').length;
            document.getElementById('totalRevenue').textContent = '$' + orders.reduce((sum, o) => sum + o.amount, 0).toFixed(2);
        }

        function toggleOrder(id) {
            if (selectedOrders.has(id)) selectedOrders.delete(id);
            else selectedOrders.add(id);
            updateBulkPanel();
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCheckbox').checked;
            const filtered = getFilteredOrders();
            if (checked) filtered.forEach(o => selectedOrders.add(o.id));
            else selectedOrders.clear();
            renderOrders();
        }

        function selectAll() { document.getElementById('selectAllCheckbox').checked = true; toggleSelectAll(); }
        function clearSelection() { document.getElementById('selectAllCheckbox').checked = false; toggleSelectAll(); }

        function updateBulkPanel() {
            document.getElementById('selectedCount').textContent = selectedOrders.size;
            document.getElementById('bulkPanel').classList.toggle('active', selectedOrders.size > 0);
        }

        function bulkAction(status) {
            orders = orders.map(o => selectedOrders.has(o.id) ? { ...o, status } : o);
            saveOrders();
            selectedOrders.clear();
            renderOrders();
        }

        function bulkDelete() {
            if (!confirm(`Delete ${selectedOrders.size} orders?`)) return;
            orders = orders.filter(o => !selectedOrders.has(o.id));
            saveOrders();
            selectedOrders.clear();
            renderOrders();
        }

        function showAddModal() { document.getElementById('addModal').classList.add('active'); }
        function hideAddModal() { document.getElementById('addModal').classList.remove('active'); }

        function addOrder() {
            const customer = document.getElementById('customerName').value.trim();
            const email = document.getElementById('customerEmail').value.trim();
            const items = parseInt(document.getElementById('itemCount').value) || 1;
            const amount = parseFloat(document.getElementById('orderAmount').value) || 0;
            const status = document.getElementById('orderStatus').value;

            if (!customer || !email) { alert('Please fill in customer name and email'); return; }

            orders.unshift({ id: generateId(), customer, email, items, amount, status, date: new Date().toISOString() });
            saveOrders();
            hideAddModal();
            renderOrders();

            // Clear form
            ['customerName', 'customerEmail', 'itemCount', 'orderAmount'].forEach(id => document.getElementById(id).value = '');
        }

        function editOrder(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;

            const newStatus = prompt('Enter new status (pending/fulfilled/cancelled):', order.status);
            if (newStatus && ['pending', 'fulfilled', 'cancelled'].includes(newStatus)) {
                order.status = newStatus;
                saveOrders();
                renderOrders();
            }
        }

        function deleteOrder(id) {
            if (!confirm('Delete this order?')) return;
            orders = orders.filter(o => o.id !== id);
            saveOrders();
            renderOrders();
        }

        function saveOrders() { localStorage.setItem('bulkMasterOrders', JSON.stringify(orders)); }

        function exportCSV() {
            const headers = ['ID', 'Customer', 'Email', 'Date', 'Status', 'Items', 'Amount'];
            const rows = orders.map(o => [o.id, o.customer, o.email, o.date, o.status, o.items, o.amount]);
            const csv = [headers, ...rows].map(r => r.join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'orders.csv';
            a.click();
        }

        function importOrders() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv,.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        if (file.name.endsWith('.json')) {
                            orders = JSON.parse(event.target.result);
                        } else {
                            // Parse CSV
                            const lines = event.target.result.split('\n').slice(1);
                            lines.forEach(line => {
                                const [id, customer, email, date, status, items, amount] = line.split(',');
                                if (customer) {
                                    orders.push({ id: id || generateId(), customer, email, date: date || new Date().toISOString(), status: status || 'pending', items: parseInt(items) || 1, amount: parseFloat(amount) || 0 });
                                }
                            });
                        }
                        saveOrders();
                        renderOrders();
                        alert('Import successful!');
                    } catch { alert('Invalid file format'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Add some sample data if empty
        if (orders.length === 0) {
            orders = [
                { id: generateId(), customer: 'John Doe', email: 'john@email.com', date: new Date().toISOString(), status: 'pending', items: 3, amount: 149.99 },
                { id: generateId(), customer: 'Sarah Miller', email: 'sarah@email.com', date: new Date(Date.now() - 86400000).toISOString(), status: 'fulfilled', items: 1, amount: 49.99 },
                { id: generateId(), customer: 'Mike Johnson', email: 'mike@email.com', date: new Date(Date.now() - 172800000).toISOString(), status: 'pending', items: 5, amount: 299.00 }
            ];
            saveOrders();
        }

        renderOrders();
    </script>
</body>

</html>
