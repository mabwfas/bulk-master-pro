<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkMaster Pro - Bulk Order Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f0f23;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text: #fff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .logo i {
            color: var(--primary);
        }

        .logo span {
            background: linear-gradient(135deg, var(--primary), #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .toolbar-left {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-warning {
            background: var(--warning);
            color: #000;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 1rem;
        }

        .search-box i {
            color: var(--text-muted);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 0.6rem;
            color: var(--text);
            width: 200px;
        }

        .search-box input:focus {
            outline: none;
        }

        .filter-dropdown {
            position: relative;
        }

        .filter-dropdown select {
            appearance: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 2rem 0.6rem 1rem;
            color: var(--text);
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.total {
            background: rgba(6, 182, 212, 0.2);
            color: var(--primary);
        }

        .stat-icon.selected {
            background: rgba(139, 92, 246, 0.2);
            color: var(--secondary);
        }

        .stat-icon.fulfilled {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .stat-icon.pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            color: var(--text);
        }

        th i {
            margin-left: 0.5rem;
            opacity: 0.5;
        }

        td {
            padding: 1rem;
            border-top: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .checkbox-cell {
            width: 50px;
            text-align: center;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .order-id {
            font-weight: 600;
            color: var(--primary);
        }

        .customer-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .customer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .customer-name {
            font-weight: 500;
        }

        .customer-email {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-badge.fulfilled {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .status-badge.processing {
            background: rgba(6, 182, 212, 0.2);
            color: var(--primary);
        }

        .amount {
            font-weight: 600;
            font-size: 1rem;
        }

        .items-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--bg-card);
            color: var(--text);
            border-color: var(--primary);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-top: 1px solid var(--border);
        }

        .page-info {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .page-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .page-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .page-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .bulk-actions-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: none;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 200;
        }

        .bulk-actions-panel.active {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .selected-count {
            font-weight: 600;
            color: var(--primary);
            min-width: 80px;
        }

        .progress-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .progress-modal.active {
            display: flex;
        }

        .progress-content {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 400px;
            text-align: center;
        }

        .progress-bar-container {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            margin: 1.5rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 6px;
            transition: width 0.3s;
        }

        .progress-status {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>

    <header>
        <div class="logo"><i class="fas fa-boxes-stacked"></i><span>BulkMaster Pro</span></div>
        <div style="display: flex; gap: 1rem;">
            <button class="btn btn-outline"><i class="fas fa-download"></i> Export</button>
            <button class="btn btn-primary"><i class="fas fa-sync"></i> Sync Orders</button>
        </div>
    </header>

    <main class="container">
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-icon total"><i class="fas fa-shopping-cart"></i></div>
                <div>
                    <div class="stat-value" id="totalOrders">156</div>
                    <div class="stat-label">Total Orders</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon selected"><i class="fas fa-check-square"></i></div>
                <div>
                    <div class="stat-value" id="selectedCount">0</div>
                    <div class="stat-label">Selected</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon fulfilled"><i class="fas fa-check-circle"></i></div>
                <div>
                    <div class="stat-value">89</div>
                    <div class="stat-label">Fulfilled</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon pending"><i class="fas fa-clock"></i></div>
                <div>
                    <div class="stat-value">67</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Search orders..."
                        id="searchInput" oninput="filterOrders()"></div>
                <div class="filter-dropdown">
                    <select id="statusFilter" onchange="filterOrders()">
                        <option value="">All Status</option>
                        <option value="fulfilled">Fulfilled</option>
                        <option value="pending">Pending</option>
                        <option value="processing">Processing</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="filter-dropdown">
                    <select id="dateFilter">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-outline" onclick="selectAll()"><i class="fas fa-check-double"></i> Select
                    All</button>
                <button class="btn btn-outline" onclick="clearSelection()"><i class="fas fa-times"></i> Clear</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell"><input type="checkbox" class="checkbox" id="selectAllCheckbox"
                                onchange="toggleSelectAll()"></th>
                        <th onclick="sortTable('id')">Order <i class="fas fa-sort"></i></th>
                        <th onclick="sortTable('customer')">Customer <i class="fas fa-sort"></i></th>
                        <th onclick="sortTable('date')">Date <i class="fas fa-sort"></i></th>
                        <th onclick="sortTable('status')">Status <i class="fas fa-sort"></i></th>
                        <th onclick="sortTable('items')">Items <i class="fas fa-sort"></i></th>
                        <th onclick="sortTable('amount')">Amount <i class="fas fa-sort"></i></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
            <div class="pagination">
                <div class="page-info">Showing 1-10 of 156 orders</div>
                <div class="page-buttons">
                    <button class="page-btn"><i class="fas fa-chevron-left"></i></button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">2</button>
                    <button class="page-btn">3</button>
                    <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </main>

    <div class="bulk-actions-panel" id="bulkPanel">
        <span class="selected-count"><span id="bulkCount">0</span> selected</span>
        <button class="btn btn-success" onclick="bulkAction('fulfill')"><i class="fas fa-check"></i> Fulfill</button>
        <button class="btn btn-warning" onclick="bulkAction('print')"><i class="fas fa-print"></i> Print Labels</button>
        <button class="btn btn-primary" onclick="bulkAction('export')"><i class="fas fa-file-export"></i>
            Export</button>
        <button class="btn btn-danger" onclick="bulkAction('cancel')"><i class="fas fa-ban"></i> Cancel</button>
    </div>

    <div class="progress-modal" id="progressModal">
        <div class="progress-content">
            <h3 id="progressTitle">Processing Orders...</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-status" id="progressStatus">0 / 0 completed</div>
        </div>
    </div>

    <footer>
        <p>Part of the <a href="#">ShopifyHero Tools</a> suite</p>
    </footer>

    <script>
        const orders = [
            { id: '#1089', customer: 'John Doe', email: 'john@email.com', date: 'Dec 18, 2024', status: 'pending', items: 3, amount: 189.99 },
            { id: '#1088', customer: 'Sarah Miller', email: 'sarah@email.com', date: 'Dec 18, 2024', status: 'fulfilled', items: 1, amount: 49.99 },
            { id: '#1087', customer: 'Mike Johnson', email: 'mike@email.com', date: 'Dec 17, 2024', status: 'processing', items: 5, amount: 299.00 },
            { id: '#1086', customer: 'Emily Brown', email: 'emily@email.com', date: 'Dec 17, 2024', status: 'fulfilled', items: 2, amount: 129.50 },
            { id: '#1085', customer: 'David Wilson', email: 'david@email.com', date: 'Dec 16, 2024', status: 'pending', items: 1, amount: 79.99 },
            { id: '#1084', customer: 'Lisa Anderson', email: 'lisa@email.com', date: 'Dec 16, 2024', status: 'cancelled', items: 4, amount: 450.00 },
            { id: '#1083', customer: 'James Taylor', email: 'james@email.com', date: 'Dec 15, 2024', status: 'fulfilled', items: 2, amount: 199.99 },
            { id: '#1082', customer: 'Jennifer Lee', email: 'jen@email.com', date: 'Dec 15, 2024', status: 'pending', items: 1, amount: 34.99 },
        ];

        let selectedOrders = new Set();

        function renderOrders(data = orders) {
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = data.map(o => `
                <tr>
                    <td class="checkbox-cell"><input type="checkbox" class="checkbox order-checkbox" data-id="${o.id}" ${selectedOrders.has(o.id) ? 'checked' : ''} onchange="toggleOrder('${o.id}')"></td>
                    <td><span class="order-id">${o.id}</span></td>
                    <td><div class="customer-info"><div class="customer-avatar">${o.customer.split(' ').map(n => n[0]).join('')}</div><div><div class="customer-name">${o.customer}</div><div class="customer-email">${o.email}</div></div></div></td>
                    <td>${o.date}</td>
                    <td><span class="status-badge ${o.status}">${o.status.charAt(0).toUpperCase() + o.status.slice(1)}</span></td>
                    <td><span class="items-count">${o.items} item${o.items > 1 ? 's' : ''}</span></td>
                    <td><span class="amount">$${o.amount.toFixed(2)}</span></td>
                    <td><div class="actions-cell"><button class="action-btn" title="View"><i class="fas fa-eye"></i></button><button class="action-btn" title="Edit"><i class="fas fa-edit"></i></button><button class="action-btn" title="Print"><i class="fas fa-print"></i></button></div></td>
                </tr>
            `).join('');
        }

        function toggleOrder(id) {
            if (selectedOrders.has(id)) selectedOrders.delete(id);
            else selectedOrders.add(id);
            updateBulkPanel();
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCheckbox').checked;
            if (checked) orders.forEach(o => selectedOrders.add(o.id));
            else selectedOrders.clear();
            renderOrders();
            updateBulkPanel();
        }

        function selectAll() { document.getElementById('selectAllCheckbox').checked = true; toggleSelectAll(); }
        function clearSelection() { document.getElementById('selectAllCheckbox').checked = false; toggleSelectAll(); }

        function updateBulkPanel() {
            const count = selectedOrders.size;
            document.getElementById('selectedCount').textContent = count;
            document.getElementById('bulkCount').textContent = count;
            document.getElementById('bulkPanel').classList.toggle('active', count > 0);
        }

        function filterOrders() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const filtered = orders.filter(o => {
                const matchSearch = o.customer.toLowerCase().includes(search) || o.id.toLowerCase().includes(search);
                const matchStatus = !status || o.status === status;
                return matchSearch && matchStatus;
            });
            renderOrders(filtered);
        }

        function sortTable(field) { /* Sorting logic */ }

        function bulkAction(action) {
            const count = selectedOrders.size;
            const modal = document.getElementById('progressModal');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('progressStatus');
            const title = document.getElementById('progressTitle');

            title.textContent = `${action.charAt(0).toUpperCase() + action.slice(1)}ing ${count} orders...`;
            modal.classList.add('active');

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        modal.classList.remove('active');
                        selectedOrders.clear();
                        updateBulkPanel();
                        renderOrders();
                    }, 500);
                }
                bar.style.width = progress + '%';
                status.textContent = `${Math.min(count, Math.floor(progress / 100 * count))} / ${count} completed`;
            }, 200);
        }

        renderOrders();
    </script>
</body>

</html>
